  - id: "java-tutor"
    title: "Java AI Tutor"
    short_description: "IRB-approved intelligent tutoring system with a scaffolded 3-condition experimental design. Scaffolded students improved quiz scores by +23.5pp over baseline. Targeting SIGCSE."
    long_description: |
      An intelligent tutoring system that delivers adaptive, scaffolded instruction for Java programming
      concepts including ArrayList, Recursion, and Queue. Built for a CofC IRB-approved research study
      (~104 participants) comparing three conditions: character-scaffolded AI tutoring, scaffold-only,
      and free-form AI chat (control).

      The system uses a 7-step pedagogical scaffold (metaphor → visual → code structure → code usage →
      practice → reflection) managed by a custom state machine. Scaffold advancement is signal-based —
      the system listens for readiness cues and blocks advancement on confusion signals.

      Key finding: scaffolded students improved quiz scores by +23.5 percentage points over the direct
      chat control (p < 0.01). A counterintuitive result: short responses like "yes" and "got it" from
      scaffolded students predicted high performance — breaking the assumption that message length equals
      engagement quality. Paper targeting SIGCSE (CS education research conference).
    tags:
