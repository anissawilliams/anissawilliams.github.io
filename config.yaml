  - id: "cofc-soccer"
    title: "CofC Soccer Analytics Pipeline"
    short_description: "Automated player evaluation system for College of Charleston Men's Soccer — COUG Table scoring, match prediction, and Monte Carlo simulation built on Wyscout data."
    long_description: |
      A production analytics pipeline built for the College of Charleston Men's Soccer program.
      Ingests Wyscout match data to automatically compute the COUG Table — a proprietary player
      evaluation framework covering defensive (ASET), offensive (PEAK), and set piece contributions.
      Includes a logistic regression match prediction model with 62.5% LOO accuracy, Monte Carlo
      win probability simulation, and an automated pre-match scouting report generator.
      Built to be maintained by undergraduate research assistants season over season.
    tags:
      - "Python"
      - "Sports Analytics"
      - "Machine Learning"
      - "Wyscout"
      - "Data Pipeline"
      - "Scouting"
    featured: true
    screenshot_folder: "cofc_soccer"
    links:
