  - id: "cfb-chaos"
    title: "CFB Chaos Factor"
    short_description: "Novel volatility metric for college football — quantifying game unpredictability through win probability swings, lead changes, and explosive play differentials. Targeting JQAS publication."
    long_description: |
      A research project introducing the Chaos Factor, a novel metric that quantifies volatility
      in college football games. Derived from win probability fluctuations, lead changes, and
      explosive play differentials, chaos captures dimensions of unpredictability that traditional
      ELO ratings overlook. Analysis of 4,600+ Power Five matchups (2018-2021) shows that chaos
      improves upset prediction by 27 percentage points over ELO alone. Co-authored with Braeden
      Mefford (College of Charleston). Targeting submission to Journal of Quantitative Analysis
      in Sports (JQAS).
    tags:
