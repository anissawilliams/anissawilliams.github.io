  - id: "cofc-soccer"
    title: "CofC Soccer Analytics Pipeline"
    short_description: "Automated player evaluation and match intelligence platform for College of Charleston Men's Soccer — predictive modeling, Monte Carlo simulation, and the proprietary COUGS Table performance framework."
    long_description: |
      A production analytics pipeline built for the College of Charleston Men's Soccer program.
      Ingests Wyscout match data to automatically compute the COUGS Table — a proprietary player
      evaluation framework covering defensive (ASET), offensive (PEAK), and set piece contributions.
      Includes a match outcome prediction model (XGBoost, 62.5% LOO accuracy vs 33% baseline),
      Monte Carlo simulation engine (10,000 iterations, Poisson goal modeling), and automated
      scouting reports. Built for reproducibility and automation to allow insights at your fingertips.
