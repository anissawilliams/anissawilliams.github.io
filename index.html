<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anissa Williams | Applied AI & Sports Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
        :root {
            --garnet: #782F40;
            --garnet-dark: #5a232f;
            --garnet-light: #8f3a4d;
            --gold: #CEB888;
            --gold-dark: #b8a070;
            --gold-light: #dbc9a0;
            --dark: #1a1a1a;
            --light: #f4f4f4;
            --text: #333333;
            --text-light: #666666;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--light); color: var(--text); line-height: 1.6; }

        /* HERO */
        .hero { background: linear-gradient(135deg, var(--garnet) 0%, var(--garnet-dark) 100%); color: var(--white); padding: 80px 20px; position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: 0; right: 0; width: 40%; height: 100%; background: linear-gradient(135deg, transparent 0%, rgba(206,184,136,0.1) 100%); clip-path: polygon(30% 0, 100% 0, 100% 100%, 0% 100%); }
        .hero-content { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 60px; position: relative; z-index: 1; }
        .hero-photo { flex-shrink: 0; }
        .hero-photo img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 4px solid var(--gold); box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .hero-text h1 { font-family: 'Playfair Display', serif; font-size: 3.2rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -1px; }
        .hero-tagline { font-size: 1.3rem; font-weight: 300; color: var(--gold); margin-bottom: 6px; letter-spacing: 2px; }
        .hero-subtitle { font-size: 1rem; opacity: 0.85; margin-bottom: 16px; }
        .hero-role { font-size: 0.95rem; opacity: 0.8; margin-bottom: 24px; max-width: 580px; line-height: 1.6; }
        .hero-links { display: flex; gap: 12px; flex-wrap: wrap; }
        .hero-link { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: var(--white); text-decoration: none; font-size: 0.9rem; transition: all 0.3s ease; }
        .hero-link:hover { background: var(--gold); color: var(--garnet); border-color: var(--gold); transform: translateY(-2px); }
        .hero-link svg { width: 16px; height: 16px; }

        /* SKILLS BAR */
        .skills-bar { background: var(--dark); padding: 18px 0; overflow: hidden; }
        .skills-track { display: flex; gap: 40px; animation: scroll 25s linear infinite; width: max-content; }
        .skills-track span { color: var(--gold); font-size: 0.85rem; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; white-space: nowrap; }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* PROJECTS */
        .projects-section { max-width: 1100px; margin: 0 auto; padding: 60px 20px; }
        .section-header { text-align: center; margin-bottom: 50px; }
        .section-header h2 { font-family: 'Playfair Display', serif; font-size: 2.4rem; color: var(--garnet); margin-bottom: 8px; }
        .section-header p { color: var(--text-light); font-size: 1rem; }

        /* Featured — side by side image + content */
        .featured-projects { display: flex; flex-direction: column; gap: 28px; margin-bottom: 40px; }

        .project-card-featured {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.09);
            display: grid;
            grid-template-columns: 460px 1fr;
            min-height: 260px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .project-card-featured:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(120,47,64,0.15); }

        .project-card-featured .card-image {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--garnet) 0%, var(--garnet-dark) 100%);
        }

        /* Regular — 3-col grid */
        .regular-projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .project-card { background: var(--white); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-decoration: none; color: inherit; display: block; transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .project-card:hover { transform: translateY(-6px); box-shadow: 0 12px 40px rgba(120,47,64,0.15); }
        .project-card .card-image { height: 180px; position: relative; overflow: hidden; background: linear-gradient(135deg, var(--garnet) 0%, var(--garnet-dark) 100%); }

        /* Screenshot strip */
        .screenshot-strip { display: flex; width: 100%; height: 100%; overflow: hidden; }
        .screenshot-strip a { flex: 1; overflow: hidden; display: block; position: relative; }
        .screenshot-strip a:not(:last-child) { border-right: 2px solid rgba(255,255,255,0.15); }
        .screenshot-strip img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; display: block; }
        .screenshot-strip a:hover img { transform: scale(1.06); }
        .screenshot-strip a::after { content: '⤢'; position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.55); color: white; width: 24px; height: 24px; border-radius: 4px; font-size: 13px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; }
        .screenshot-strip a:hover::after { opacity: 1; }

        /* Placeholder */
        .placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 2.5rem; }
        .placeholder span { font-size: 0.7rem; font-family: 'Inter', sans-serif; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-light); opacity: 0.8; }

        /* Content */
        .project-content { padding: 28px; }
        .project-card-featured .project-content { display: flex; flex-direction: column; justify-content: center; padding: 36px; }
        .project-content h3 { font-size: 1.3rem; font-weight: 600; margin-bottom: 10px; color: var(--garnet); }
        .project-card-featured .project-content h3 { font-size: 1.55rem; margin-bottom: 12px; }
        .project-content p { color: var(--text-light); font-size: 0.93rem; margin-bottom: 18px; line-height: 1.6; }
        .project-card-featured .project-content p { font-size: 1rem; }
        .project-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .project-tag { background: var(--light); color: var(--text-light); padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 500; }
        .project-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .project-link { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 500; text-decoration: none; transition: all 0.2s ease; }
        .project-link.primary { background: var(--garnet); color: var(--white); }
        .project-link.primary:hover { background: var(--garnet-dark); }
        .project-link.secondary { background: transparent; color: var(--garnet); border: 1px solid var(--garnet); }
        .project-link.secondary:hover { background: var(--garnet); color: var(--white); }

        /* FOOTER */
        footer { background: var(--dark); color: var(--white); padding: 36px 20px; text-align: center; }
        footer p { opacity: 0.6; font-size: 0.88rem; }
        footer a { color: var(--gold); text-decoration: none; }

        .loading { text-align: center; padding: 100px 20px; color: var(--text-light); }

        /* RESPONSIVE */
        @media (max-width: 800px) {
            .hero-content { flex-direction: column; text-align: center; }
            .hero-text h1 { font-size: 2.4rem; }
            .hero-links { justify-content: center; }
            .project-card-featured { grid-template-columns: 1fr; }
            .project-card-featured .card-image { height: 200px; }
            .regular-projects { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="app"><div class="loading">Loading portfolio...</div></div>

    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <script>
        const ICONS = { portaliq:'🏈', 'cfb-chaos':'📈', cfb_chaos:'📈', 'java-tutor':'🤖', 'java-tutor-analytics':'📊', java_tutor:'🤖', java_tutor_analytics:'📊' };

        function imageSection(project, maxVis) {
            if (!project._shots || project._shots.length === 0) {
                return `<div class="placeholder">${ICONS[project.id]||'📊'}<span>Coming Soon</span></div>`;
            }
            const base = `assets/projects/${project._folder}/`;
            const gid  = `g-${project.id}`;
            const vis  = project._shots.slice(0, maxVis);
            const hid  = project._shots.slice(maxVis);
            const strip = vis.map((s,i) => `
                <a href="${base}${s}" class="glightbox" data-gallery="${gid}" data-description="${project.title}" onclick="event.stopPropagation()">
                    <img src="${base}${s}" alt="${project.title} ${i+1}" onerror="this.parentElement.style.display='none'">
                </a>`).join('');
            const extra = hid.map(s => `<a href="${base}${s}" class="glightbox" data-gallery="${gid}" style="display:none" onclick="event.stopPropagation()"></a>`).join('');
            return `<div class="screenshot-strip">${strip}</div>${extra}`;
        }

        function linkButtons(project) {
            const out = [];
            if (project.links?.live)   out.push(`<a href="${project.links.live}" target="_blank" class="project-link primary" onclick="event.stopPropagation()">Live Demo ↗</a>`);
            if (project.links?.github) out.push(`<a href="${project.links.github}" target="_blank" class="project-link secondary" onclick="event.stopPropagation()">GitHub</a>`);
            return out.length ? `<div class="project-links">${out.join('')}</div>` : '';
        }

        function tags(list, max) {
            return `<div class="project-tags">${list.slice(0,max).map(t=>`<span class="project-tag">${t}</span>`).join('')}</div>`;
        }

        async function loadPortfolio() {
            try {
                const [cfgRes, mfRes] = await Promise.all([
                    fetch('config.yaml'),
                    fetch('assets/projects/manifest.json').catch(()=>({ok:false}))
                ]);
                const config   = jsyaml.load(await cfgRes.text());
                const manifest = mfRes.ok ? await mfRes.json() : {};

                config.projects = config.projects.map(p => {
                    const folder = p.screenshot_folder || p.id;
                    const shots  = manifest[folder];
                    if (shots && shots.length) { p._shots = shots; p._folder = folder; }
                    return p;
                });

                const featured = config.projects.filter(p => p.featured);
                const regular  = config.projects.filter(p => !p.featured);

                const featuredHTML = featured.map(p => `
                    <div class="project-card-featured">
                        <div class="card-image">${imageSection(p, 2)}</div>
                        <div class="project-content">
                            <h3>${p.title}</h3>
                            <p>${p.short_description}</p>
                            ${tags(p.tags, 5)}
                            ${linkButtons(p)}
                        </div>
                    </div>`).join('');

                const regularHTML = regular.map(p => `
                    <div class="project-card">
                        <div class="card-image">${imageSection(p, 1)}</div>
                        <div class="project-content">
                            <h3>${p.title}</h3>
                            <p>${p.short_description}</p>
                            ${tags(p.tags, 4)}
                            ${linkButtons(p)}
                        </div>
                    </div>`).join('');

                document.getElementById('app').innerHTML = `
                    <section class="hero">
                        <div class="hero-content">
                            <div class="hero-photo">
                                <img src="${config.headshot}" alt="${config.name}" onerror="this.style.display='none'">
                            </div>
                            <div class="hero-text">
                                <p class="hero-tagline">${config.tagline}</p>
                                <h1>${config.name}</h1>
                                <p class="hero-subtitle">${config.subtitle}</p>
                                ${config.role ? `<p class="hero-role">${config.role}</p>` : ''}
                                <div class="hero-links">
                                    ${config.social.github ? `<a href="${config.social.github}" class="hero-link" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>GitHub</a>` : ''}
                                    ${config.social.linkedin ? `<a href="${config.social.linkedin}" class="hero-link" target="_blank"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>LinkedIn</a>` : ''}
                                    ${config.social.email ? `<a href="mailto:${config.social.email}" class="hero-link"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M0 3v18h24v-18h-24zm21.518 2l-9.518 7.713-9.518-7.713h19.036zm-19.518 14v-11.817l10 8.104 10-8.104v11.817h-20z"/></svg>Email</a>` : ''}
                                </div>
                            </div>
                        </div>
                    </section>

                    <div class="skills-bar">
                        <div class="skills-track">
                            ${config.skills.map(s=>`<span>${s}</span>`).join('')}
                            ${config.skills.map(s=>`<span>${s}</span>`).join('')}
                        </div>
                    </div>

                    <section class="projects-section">
                        <div class="section-header">
                            <h2>Featured Work</h2>
                            <p>AI systems, analytics platforms, and sports intelligence</p>
                        </div>
                        <div class="featured-projects">${featuredHTML}</div>
                        ${regular.length ? `<div class="regular-projects">${regularHTML}</div>` : ''}
                    </section>

                    <footer>
                        <p>&copy; ${new Date().getFullYear()} ${config.name} &middot; Built with ☕ and data</p>
                    </footer>`;

                GLightbox({ selector: '.glightbox', touchNavigation: true, loop: true });

            } catch(err) {
                console.error(err);
                document.getElementById('app').innerHTML = '<div class="loading"><p>Error loading portfolio.</p></div>';
            }
        }

        loadPortfolio();
    </script>
</body>
</html>
